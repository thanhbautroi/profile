<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Mạnh Thành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700;800;900&family=Sora:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070d;--ink:#e9e9f5;--muted:#8a8aa3;--cyan:#22d3ee;--violet:#a855f7;--violet2:#7c3aed;--line:rgba(255,255,255,.08);--card:rgba(255,255,255,.025)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Sora',sans-serif;min-height:100vh}

.layout{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

.sidebar{background:rgba(255,255,255,.03);border-right:1px solid var(--line);padding:28px 24px;
  display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}

.logo{font-family:'Space Mono',monospace;font-weight:700;font-size:1.05rem;letter-spacing:-1px}
.logo span{color:var(--cyan)}
.badge{font-size:.68rem;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);
  color:var(--violet);padding:2px 8px;border-radius:20px;margin-left:6px;
  font-family:'Sora',sans-serif;font-weight:600;vertical-align:middle}

.s-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}

.upload-area{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;
  cursor:pointer;transition:border-color .25s,background .25s;color:var(--muted);font-size:.88rem;
  position:relative}
.upload-area:hover,.upload-area.drag{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.05);color:var(--ink)}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:1.8rem;margin-bottom:6px;display:block}
#previewImg{width:100%;border-radius:10px;margin-top:10px;max-height:140px;object-fit:cover;display:none}

.or-line{text-align:center;color:var(--muted);font-size:.78rem;position:relative;margin:4px 0}
.or-line::before,.or-line::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--line)}
.or-line::before{left:0}.or-line::after{right:0}

.form-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;color:var(--ink);font-family:'Sora',sans-serif;font-size:.88rem;
  outline:none;transition:border-color .25s;margin-bottom:10px}
.form-input:focus{border-color:rgba(168,85,247,.5)}
.form-input::placeholder{color:var(--muted)}
textarea.form-input{resize:vertical;min-height:72px;line-height:1.5;margin-bottom:0}

.form-err{color:#f87171;font-size:.78rem;min-height:18px;margin:6px 0}

.btn-add{width:100%;padding:13px;border:none;border-radius:40px;cursor:pointer;font-size:.88rem;font-weight:600;
  background:linear-gradient(120deg,var(--violet),var(--cyan));color:#07070d;
  font-family:'Sora',sans-serif;transition:transform .2s,box-shadow .2s}
.btn-add:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(168,85,247,.4)}
.btn-add:disabled{opacity:.5;cursor:not-allowed;transform:none}

.progress-wrap{display:none;margin-top:10px}
.progress-bar-bg{background:var(--line);border-radius:10px;height:4px}
.progress-bar-fill{height:4px;border-radius:10px;background:linear-gradient(90deg,var(--violet),var(--cyan));width:0%;transition:width .2s}
.progress-label{font-size:.76rem;color:var(--muted);margin-top:6px;text-align:center}

.s-link{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;
  text-decoration:none;color:var(--muted);font-size:.86rem;transition:background .2s,color .2s;
  border:none;background:transparent;cursor:pointer;width:100%;text-align:left}
.s-link:hover{background:var(--card);color:var(--ink)}
.s-link.danger:hover{color:#f87171;background:rgba(248,113,113,.08)}

.main{padding:36px 36px;overflow-y:auto}
@media(max-width:600px){.main{padding:20px 16px}}

.main-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.main-header h1{font-family:'Be Vietnam Pro',sans-serif;font-size:1.7rem;font-weight:700;letter-spacing:-1px}
.count-badge{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--cyan);
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.2);padding:5px 14px;border-radius:20px}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dash-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  position:relative;transition:border-color .25s,transform .25s}
.dash-card:hover{border-color:rgba(168,85,247,.35);transform:translateY(-3px)}
.dash-card img{width:100%;height:140px;object-fit:cover;display:block}
.dash-card .info{padding:11px 13px}
.dash-card .info strong{font-size:.88rem;font-weight:600;display:block;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-card .info span{font-size:.74rem;color:var(--muted)}
.dash-card .del{position:absolute;top:7px;right:7px;background:rgba(7,7,13,.75);
  border:1px solid rgba(248,113,113,.35);color:#f87171;border-radius:8px;
  padding:4px 10px;font-size:.72rem;cursor:pointer;transition:background .2s;backdrop-filter:blur(4px)}
.dash-card .del:hover{background:rgba(248,113,113,.25)}

.empty{text-align:center;padding:80px 0;color:var(--muted)}
.empty .eicon{font-size:3rem;margin-bottom:16px;display:block}

.skeleton{background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,.05) 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:14px;height:200px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;font-size:.86rem;
  transform:translateY(60px);opacity:0;transition:all .3s;z-index:200;backdrop-filter:blur(12px);
  background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3)}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">MT<span>.</span><span class="badge">Dashboard</span></div>

    <div class="s-label">Thêm ảnh mới</div>

    <form id="addForm" novalidate>
      <div class="upload-area" id="uploadArea">
        <span class="upload-icon">🖼️</span>
        <div>Kéo thả hoặc <b style="color:var(--violet)">chọn ảnh</b></div>
        <small>JPG, PNG, WEBP...</small>
        <input type="file" id="fileInput" accept="image/*">
        <img id="previewImg" src="" alt="preview">
      </div>

      <div class="or-line">hoặc nhập URL</div>
      <input class="form-input" type="url" id="imgUrl" placeholder="https://...">
      <input class="form-input" type="text" id="imgTitle" placeholder="Tiêu đề ảnh *">
      <textarea class="form-input" id="imgCaption" placeholder="Mô tả (tùy chọn)"></textarea>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Đang tải lên...</div>
      </div>

      <p class="form-err" id="formErr"></p>
      <button class="btn-add" type="submit" id="submitBtn">+ Thêm vào bộ sưu tập</button>
    </form>

    <div style="display:flex;flex-direction:column;gap:4px;margin-top:auto">
      <a href="index.html" class="s-link">🏠 Về trang chủ</a>
      <button class="s-link danger" id="logoutBtn">🚪 Đăng xuất</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Bộ sưu tập ảnh</h1>
      <span class="count-badge" id="countBadge">0 ảnh</span>
    </div>
    <div id="dashGrid" class="dash-grid"></div>
    <div id="emptyMsg" class="empty" style="display:none">
      <span class="eicon">📷</span>
      <p>Chưa có ảnh nào. Thêm ảnh đầu tiên!</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
if(sessionStorage.getItem('mt_auth')!=='1') location.href='login.html';

// Firebase init
firebase.initializeApp({
  apiKey:"AIzaSyBkS-XaN5oaUTh1st_Gf3NB7xZoXMqJGgc",
  authDomain:"thanbautroi-ede0c.firebaseapp.com",
  projectId:"thanbautroi-ede0c",
  storageBucket:"thanbautroi-ede0c.firebasestorage.app",
  messagingSenderId:"784971627810",
  appId:"1:784971627810:web:9e83f0f9643a36a8c5b97b"
});
const db = firebase.firestore();

// Cloudinary config
const CLOUD = 'drszxhscf';
const PRESET = 'thanhbautroi';

// Toast
function toast(msg, isErr=false){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast'+(isErr?' err':'');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Render gallery từ Firestore (realtime)
db.collection('gallery').orderBy('createdAt','desc').onSnapshot(snapshot=>{
  const items=snapshot.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('countBadge').textContent=items.length+' ảnh';
  const empty=document.getElementById('emptyMsg');
  const grid=document.getElementById('dashGrid');

  if(!items.length){
    grid.innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';
  grid.innerHTML=items.map(item=>`
    <div class="dash-card">
      <img src="${esc(item.imageUrl)}" alt="${esc(item.title)}" loading="lazy"
        onerror="this.style.background='#0c0c18';this.style.height='140px'">
      <div class="info">
        <strong title="${esc(item.title)}">${esc(item.title)}</strong>
        <span>${item.date||''}</span>
      </div>
      <button class="del" onclick="del('${item.id}')">Xóa</button>
    </div>
  `).join('');
}, err=>{
  console.error(err);
  toast('Không thể tải dữ liệu: '+err.message, true);
});

// Xóa ảnh
async function del(id){
  if(!confirm('Xóa ảnh này khỏi bộ sưu tập?')) return;
  try{
    await db.collection('gallery').doc(id).delete();
    toast('Đã xóa ảnh!');
  }catch(e){ toast('Lỗi xóa: '+e.message,true); }
}

// Upload lên Cloudinary
async function uploadCloudinary(file, onProgress){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    const fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',PRESET);
    xhr.upload.onprogress=e=>{
      if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload=()=>{
      const res=JSON.parse(xhr.responseText);
      if(res.secure_url) resolve(res.secure_url);
      else reject(new Error(res.error?.message||'Upload thất bại'));
    };
    xhr.onerror=()=>reject(new Error('Lỗi kết nối'));
    xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`);
    xhr.send(fd);
  });
}

// File preview
const fileInput=document.getElementById('fileInput');
const previewImg=document.getElementById('previewImg');
fileInput.addEventListener('change',()=>{
  const f=fileInput.files[0];
  if(!f) return;
  previewImg.src=URL.createObjectURL(f);
  previewImg.style.display='block';
  document.getElementById('imgUrl').value='';
});

// Drag & drop
const area=document.getElementById('uploadArea');
area.addEventListener('dragover',e=>{e.preventDefault();area.classList.add('drag')});
area.addEventListener('dragleave',()=>area.classList.remove('drag'));
area.addEventListener('drop',e=>{
  e.preventDefault();area.classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/')){
    const dt=new DataTransfer();dt.items.add(f);fileInput.files=dt.files;
    previewImg.src=URL.createObjectURL(f);previewImg.style.display='block';
  }
});

// Submit form
document.getElementById('addForm').onsubmit=async function(e){
  e.preventDefault();
  const title=document.getElementById('imgTitle').value.trim();
  const caption=document.getElementById('imgCaption').value.trim();
  const urlVal=document.getElementById('imgUrl').value.trim();
  const file=fileInput.files[0];
  const errEl=document.getElementById('formErr');

  if(!title){errEl.textContent='Vui lòng nhập tiêu đề!';return;}
  if(!file&&!urlVal){errEl.textContent='Vui lòng chọn ảnh hoặc nhập URL!';return;}
  errEl.textContent='';

  const btn=document.getElementById('submitBtn');
  const pw=document.getElementById('progressWrap');
  const pf=document.getElementById('progressFill');
  const pl=document.getElementById('progressLabel');
  btn.disabled=true;

  try{
    let imageUrl=urlVal;
    if(file){
      pw.style.display='block';
      btn.textContent='Đang tải lên...';
      imageUrl=await uploadCloudinary(file,pct=>{
        pf.style.width=pct+'%';
        pl.textContent='Đang tải lên... '+pct+'%';
      });
      pf.style.width='100%';
      pl.textContent='Xong! Đang lưu...';
    } else {
      btn.textContent='Đang lưu...';
    }

    await db.collection('gallery').add({
      imageUrl,
      title,
      caption,
      date: new Date().toLocaleDateString('vi-VN'),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('addForm').reset();
    previewImg.style.display='none';
    previewImg.src='';
    toast('Đã thêm ảnh thành công! ✓');
  }catch(err){
    toast('Lỗi: '+err.message, true);
    errEl.textContent=err.message;
  }finally{
    btn.disabled=false;
    btn.textContent='+ Thêm vào bộ sưu tập';
    pw.style.display='none';
    pf.style.width='0%';
  }
};

document.getElementById('logoutBtn').onclick=function(){
  sessionStorage.removeItem('mt_auth');
  location.href='login.html';
};
</script>
</body>
</html>
